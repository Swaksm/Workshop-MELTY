# Nom de projet fixe : mêmes noms d'image et de volumes quel que soit le dossier du dépôt
name: sentinelx

# Options communes : redémarrage auto, pas d'élévation de privilèges, logs limités (MCO)
x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *common
    image: postgres:16
    env_file: .env
    mem_limit: 512m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]   # minimum requis par l'image postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # aucun port publié : joignable uniquement par le réseau Docker

  mosquitto:
    <<: *common
    image: eclipse-mosquitto:2
    user: "1883:1883"            # tourne sous l'utilisateur mosquitto, jamais root
    mem_limit: 128m
    cap_drop: [ALL]
    read_only: true              # seul le volume de données est inscriptible
    ports:
      - "127.0.0.1:1883:1883"            # en clair, uniquement en local (vision, tests)
      - "127.0.0.1:8883:8883"            # TLS, tests locaux
      - "${SERVER_IP:?lancer lancer.ps1 ou definir SERVER_IP dans .env}:8883:8883"   # TLS, ESP32 (Wi-Fi)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/certs/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./mosquitto/certs/server.crt:/mosquitto/certs/server.crt:ro
      - ./mosquitto/certs/server.key:/mosquitto/certs/server.key:ro
      - mosquitto-data:/mosquitto/data

  backend:
    <<: *common
    build: ./backend
    env_file: .env
    mem_limit: 1g
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8000:8000"            # dashboard sur le PC
      - "${SERVER_IP:?lancer lancer.ps1 ou definir SERVER_IP dans .env}:8000:8000"   # autres appareils du Wi-Fi
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    volumes:
      - model-data:/code/models
      - ./media:/code/media:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  mosquitto-data:
  model-data: