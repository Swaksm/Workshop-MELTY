# Nom de projet fixe : mêmes noms d'image et de volumes quel que soit le dossier du dépôt
name: sentinelx

# Options communes : redémarrage auto, pas d'élévation de privilèges, logs limités (MCO)
x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *common
    image: postgres:16
    env_file: .env
    mem_limit: 512m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]   # minimum requis par l'image postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # aucun port publié : joignable uniquement par le réseau Docker

  mosquitto:
    <<: *common
    image: eclipse-mosquitto:2
    user: "1883:1883"            # tourne sous l'utilisateur mosquitto, jamais root
    mem_limit: 128m
    cap_drop: [ALL]
    read_only: true              # seul le volume de données est inscriptible
    ports:
      - "127.0.0.1:1883:1883"            # en clair, uniquement en local (vision, tests)
      - "127.0.0.1:8883:8883"            # TLS, tests locaux
      - "${SERVER_IP:?lancer lancer.ps1 ou definir SERVER_IP dans .env}:8883:8883"   # TLS, ESP32 (Wi-Fi)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/certs/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./mosquitto/certs/server.crt:/mosquitto/certs/server.crt:ro
      - ./mosquitto/certs/server.key:/mosquitto/certs/server.key:ro
      - mosquitto-data:/mosquitto/data

  backend:
    <<: *common
    build: ./backend
    env_file: .env
    mem_limit: 1g
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8000:8000"            # local uniquement (Swagger, dashboard de dev, tests)
                                         # depuis le Wi-Fi : https://SERVER_IP/api via le proxy
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    volumes:
      - model-data:/code/models
      - ./media:/code/media              # écriture : purge des vieux clips (rétention)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Reverse proxy HTTPS : dashboard compilé, API et flux vidéo, avec le certificat de
  # la CA du projet. Seul port web joignable depuis le Wi-Fi (443).
  proxy:
    <<: *common
    build: ./frontend
    mem_limit: 128m
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:443:8443"
      - "${SERVER_IP:?lancer lancer.ps1 ou definir SERVER_IP dans .env}:443:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # module vision, qui tourne sur le PC
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./mosquitto/certs/server.crt:/certs/server.crt:ro
      - ./mosquitto/certs/server.key:/certs/server.key:ro
      - ./mosquitto/certs/ca.crt:/certs/ca.crt:ro                              # vérifie les certificats clients
      - ./mosquitto/certs/clients/autorises.pem:/certs/clients/autorises.pem:ro  # postes autorisés

  # Supervision (MCO) : CPU, RAM, réseau et disque de chaque conteneur, interface sur
  # http://localhost:8080. Montages en lecture seule, interface jamais exposée au Wi-Fi.
  # Il lit le socket containerd (seul service qui y a accès) : à surveiller dans la
  # matrice de sécurité, ce socket donne la main sur les conteneurs.
  cadvisor:
    <<: *common
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]                     # lecture seule des métriques : aucune capacité
    command:
      - --docker_only=true              # seulement les conteneurs, pas tous les process
      - --housekeeping_interval=10s     # une mesure toutes les 10 s, assez pour le MCO
      # Docker Desktop range les conteneurs via containerd (espace "moby") : le mode
      # docker classique de cAdvisor ne les trouve pas, on les lit donc par containerd
      - --containerd=/var/run/containerd/containerd.sock
      - --docker=unix:///var/run/absent.sock   # désactive le mode docker classique
      - --containerd-namespace=moby
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run/containerd/containerd.sock:/var/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

volumes:
  pgdata:
  mosquitto-data:
  model-data: