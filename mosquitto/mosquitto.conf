# Authentification et contrôle d'accès, valables pour tous les ports
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# 1883 en clair : réseau interne Docker (backend) et boucle locale du PC (vision)
# Ce port n'est PAS publié sur le réseau de table (voir docker-compose.yml)
listener 1883
max_connections 20

# 8883 chiffré TLS : seul port MQTT accessible depuis le réseau de table (ESP32)
# TLS mutuel : le client doit présenter un certificat signé par la CA du projet
# (clients/esp32.crt), puis s'authentifier par mot de passe comme avant.
listener 8883
max_connections 10
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate true

# Anti-déni de service : taille de message bornée (une image de la vision fait
# environ 100 Ko en base64), file d'attente et messages en vol limités par client
max_packet_size 1048576
max_queued_messages 1000
max_inflight_messages 20

persistence true
persistence_location /mosquitto/data/
